<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 1120 400" width="100%" style="display:block" role="img"
     aria-labelledby="base-t base-d">
  <title id="base-t">The baseline never exists when you need it</title>
  <desc id="base-d">Nobody logs anything until a symptom shows up. By then the earlier stretch, the one worth comparing against, was never recorded.</desc>

