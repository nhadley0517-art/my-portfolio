<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #1C1C1E;
    }

    .container {
      width: 100%;
      height: 100%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .glow {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 70%;
      height: 200%;
      border-radius: 50%;
      background: radial-gradient(ellipse at center, rgba(126, 183, 127, 0.13) 0%, transparent 65%);
      pointer-events: none;
    }

    .phones {
      position: relative;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7%;
      height: 100%;
      padding: 0;
    }

    .phone {
      border-radius: 11px;
      overflow: hidden;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.55);
      flex-shrink: 1;
      min-width: 0;
    }

    /* Sized by height alone on a wide container, but this same file gets
       embedded as the mobile hero thumbnail at widths as narrow as ~200px —
       height-only sizing there forces all 3 phones far wider than the row
       has room for, shoving the side phones mostly off-screen. Auto on both
       axes plus a max on both is the "contain" pattern: whichever bound is
       tighter wins, and aspect-ratio keeps the other axis proportional
       either way, so a narrow row shrinks the phones instead of clipping them. */
    .phone-center {
      height: auto;
      width: auto;
      max-height: 90%;
      max-width: 32%;
      aspect-ratio: 9 / 19.5;
    }

    .phone-side {
      height: auto;
      width: auto;
      max-height: 76%;
      max-width: 26%;
      aspect-ratio: 9 / 19.5;
    }

    .phone-left {
      transform: rotate(-1deg) translateY(8%);
    }

    .phone-right {
      transform: rotate(1deg) translateY(8%);
    }

    .phone video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="glow"></div>

    <div class="phones">
      <div class="phone phone-side phone-left">
        <video src="/calendar-screen.mp4" autoplay loop muted playsinline></video>
      </div>
      <div class="phone phone-center">
        <video src="/home-screen.mp4" autoplay loop muted playsinline></video>
      </div>
      <div class="phone phone-side phone-right">
        <video src="/insights-screen.mp4" autoplay loop muted playsinline></video>
      </div>
    </div>
  </div>
</body>
</html>
