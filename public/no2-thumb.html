<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #1C1C1E;
    }

    .container {
      width: 100%;
      height: 100%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .glow {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 70%;
      height: 200%;
      border-radius: 50%;
      background: radial-gradient(ellipse at center, rgba(126, 183, 127, 0.13) 0%, transparent 65%);
      pointer-events: none;
    }

    .phones {
      position: relative;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: center;
      /* Phones are already sized to fill most of the row (max-width below),
         so a wide gap here was what pushed the outer two flush against the
         container edge — less gap between them leaves more margin on the
         outside instead, since the group is centered as a whole. */
      gap: 3%;
      height: 100%;
      padding: 0;
    }

    .phone {
      border-radius: 11px;
      overflow: hidden;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.55);
      flex-shrink: 1;
      min-width: 0;
    }

    /* Regular desktop only (the plateaued ~276px-wide thumb, matching the
       same 1300px cutoff the home page's Selected Work grid itself uses)
       — everything else that shares the default 11px above (mobile, both
       the home thumb and the case-study hero) stays untouched. Gated by
       the same ctx class mechanism as the small-desktop override below. */
    body.ctx-desktop .phone { border-radius: 10px; }

    /* This file is also embedded (much smaller) as the home page's Selected
       Work thumbnail, which shrinks a lot at both tablet AND "small desktop"
       widths — the desktop sidebar is still reserving space (or the 3-col
       row just hasn't gone full-width yet), so the phones themselves can
       drop under ~50px wide. 11px fixed stayed constant while the phone
       shrank, so it grew to be half the phone's width — a blob, not a
       phone. This only matches when the IFRAME's own rendered width is
       small too, so the regular-desktop thumb (~276px) and the mobile hero
       (~300px+) are untouched.

       Tablet and small-desktop widths land on overlapping IFRAME pixel
       sizes (e.g. iPad landscape at 1024px outer renders a narrower thumb
       than a 768px-wide tablet does), so the iframe's own width alone can't
       tell them apart — a body class set from the outer page's real
       viewport width below does that instead, matching the same 900px
       cutoff the site's own SideNav uses to switch to its mobile layout. */
    @media (max-width: 260px) {
      .phone { border-radius: 4px; }
      body.ctx-small-desktop .phone { border-radius: 4px; }
    }

    /* Sized by height alone on a wide container, but this same file gets
       embedded as the mobile hero thumbnail at widths as narrow as ~200px —
       height-only sizing there forces all 3 phones far wider than the row
       has room for, shoving the side phones mostly off-screen. Auto on both
       axes plus a max on both is the "contain" pattern: whichever bound is
       tighter wins, and aspect-ratio keeps the other axis proportional
       either way, so a narrow row shrinks the phones instead of clipping them. */
    .phone-center {
      height: auto;
      width: auto;
      max-height: 90%;
      max-width: 32%;
      aspect-ratio: 9 / 19.5;
    }

    .phone-side {
      height: auto;
      width: auto;
      max-height: 76%;
      max-width: 26%;
      aspect-ratio: 9 / 19.5;
    }

    .phone-left {
      transform: rotate(-1deg) translateY(8%);
    }

    .phone-right {
      transform: rotate(1deg) translateY(8%);
    }

    .phone video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="glow"></div>

    <div class="phones">
      <div class="phone phone-side phone-left">
        <video src="/no2-demos/updated-insights.mp4" autoplay loop muted playsinline></video>
      </div>
      <div class="phone phone-center">
        <video src="/no2-demos/updated-home.mp4" autoplay loop muted playsinline></video>
      </div>
      <div class="phone phone-side phone-right">
        <video src="/no2-demos/updated-logging.mp4" autoplay loop muted playsinline></video>
      </div>
    </div>
  </div>

  <script>
    // Same-origin parent (this file only ever lives inside this site's own
    // pages), so we can read the real outer viewport width directly instead
    // of guessing from this iframe's own rendered size — see the .phone
    // comment above for why that's necessary.
    (function () {
      function syncContext() {
        var w;
        try { w = window.parent.innerWidth; } catch (e) { w = window.innerWidth; }
        document.body.classList.toggle('ctx-small-desktop', w > 900 && w <= 1300);
        document.body.classList.toggle('ctx-desktop', w > 1300);
      }
      syncContext();
      window.addEventListener('resize', syncContext);
    })();
  </script>
</body>
</html>
