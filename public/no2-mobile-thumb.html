<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111111;
    }

    .container {
      width: 100%;
      height: 100%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .glow {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 80%;
      height: 180%;
      border-radius: 50%;
      background: radial-gradient(ellipse at center, rgba(126, 183, 127, 0.18) 0%, transparent 65%);
      pointer-events: none;
    }

    .phones {
      position: relative;
      z-index: 5;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 28px;
      padding: 6% 5%;
    }

    .phone {
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.65);
      flex-shrink: 0;
    }

    /* Width-based sizing keeps phones proportional to card width,
       leaving the gap room to breathe regardless of card height. */
    .phone-center {
      width: 27%;
      height: auto;
      aspect-ratio: 9 / 19.5;
    }

    .phone-side {
      width: 20%;
      height: auto;
      aspect-ratio: 9 / 19.5;
    }

    .phone-left  { transform: rotate(-1.5deg) translateY(4%); }
    .phone-right { transform: rotate(1.5deg)  translateY(4%); }

    .phone video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="glow"></div>
    <div class="phones">
      <div class="phone phone-side phone-left">
        <video src="/calendar-screen.mp4" autoplay loop muted playsinline></video>
      </div>
      <div class="phone phone-center">
        <video src="/home-screen.mp4" autoplay loop muted playsinline></video>
      </div>
      <div class="phone phone-side phone-right">
        <video src="/insights-screen.mp4" autoplay loop muted playsinline></video>
      </div>
    </div>
  </div>
</body>
</html>
